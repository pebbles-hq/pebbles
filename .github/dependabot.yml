# Dependency update PRs. Dependabot proposes the upgrades; the Security workflow
# (cargo-audit + cargo-deny) is what actually gates a vulnerable graph.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The GPU/windowing stack moves in lockstep (wgpu ↔ naga ↔ winit). The vello crates pin
      # wgpu's major while the transitional vello-hybrid backend exists; X09 removes them.
      graphics-stack:
        patterns: ["wgpu", "naga", "winit", "raw-window-handle", "peniko", "kurbo", "lyon*", "guillotiere", "bytemuck", "vello", "vello_hybrid", "vello_common"]
      # The text stack: cosmic-text pins fontdb, harfrust and skrifa; swash pins zeno.
      text-stack:
        patterns: ["cosmic-text", "swash", "zeno", "skrifa", "harfrust", "fontdb", "parley"]
      dev-dependencies:
        dependency-type: development

  # Keep the SHA-pinned actions current — a pin is only safe if it is maintained.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
