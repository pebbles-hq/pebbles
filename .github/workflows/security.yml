name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC — catches newly published advisories without a push.
    - cron: "0 2 * * *"
    # Weekly, Sunday 03:00 UTC — the font fuzzers (job fuzz-fonts).
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Minimal default token scope; jobs that upload SARIF escalate themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # cargo-audit — the RustSec advisory database. This is the SCA gate: it finds
  # CVEs in our DEPENDENCY graph (the Rust counterpart of govulncheck), whereas
  # clippy/miri below examine our own code. Needs no token or account, so it
  # cannot silently stop running.
  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit
      # Fails on any VULNERABILITY affecting the locked graph. Deliberately not
      # `--deny warnings`: unmaintained/yanked-crate policy belongs in deny.toml
      # where it is reviewable in-tree, and a GUI dependency graph always has
      # some unmaintained leaf — gating on that trains people to ignore the job.
      - run: cargo audit

  # ───────────────────────────────────────────────────────────────────────────
  # cargo-deny — the supply-chain policy gate, driven by deny.toml: advisories,
  # license allow-list, duplicate/banned crates, and permitted source
  # registries. Split into named checks so a failure says WHICH policy broke.
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed onto the runner rather than using the containerized action:
      # that container is musl-based and cannot resolve this repo's
      # rust-toolchain.toml, which made every run log a toolchain override
      # error. Running it here means CI and `cargo deny` locally behave
      # identically.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      - run: cargo deny check ${{ matrix.check }}

  # ───────────────────────────────────────────────────────────────────────────
  # Gitleaks — secrets/credentials committed anywhere in git HISTORY, not just
  # the current snapshot. Uses the CLI directly (the v2 action requires an org
  # license). Results land in Security → Code Scanning.
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION="v8.24.3"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Ensure SARIF file exists
        # Gitleaks writes no report when zero leaks are found, but
        # upload-sarif requires the file — emit a valid empty one.
        if: always()
        run: |
          [ -f gitleaks.sarif ] || cat <<'EOF' > gitleaks.sarif
          {"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","rules":[]}},"results":[]}]}
          EOF

      - name: Upload Gitleaks results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ───────────────────────────────────────────────────────────────────────────
  # Miri — undefined-behaviour detector. This is the security-relevant SAST for
  # this codebase: the native-menu FFI bridge contains `unsafe` (and the
  # proc-macro emits one `#[unsafe(no_mangle)]`), and UB there is exactly the
  # class of bug that becomes a memory-safety vulnerability. Scoped to
  # pebbles-core's own tests (miri interprets the program, so it cannot run
  # GPU/windowing code). The reactive runtime contains no `unsafe`, but Miri
  # still guards it against dependency UB + future regressions.
  #
  # GATING on push/PR: the scheduled baseline has been green for days, so real UB
  # regressions now block merges (was schedule-only + continue-on-error).
  # ───────────────────────────────────────────────────────────────────────────
  miri:
    name: Miri (unsafe / UB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: miri
      - name: Miri — reactive runtime
        env:
          # Stacked Borrows is strict about the aliasing patterns an arena +
          # thread_local runtime uses; Tree Borrows is the model those patterns
          # are actually checked against upstream.
          MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-disable-isolation"
        # `+nightly` explicitly: rust-toolchain.toml pins stable and OVERRIDES
        # `rustup default nightly`, so without it cargo resolves to stable —
        # where miri is not installed — and the job dies before running a test.
        run: cargo +nightly miri test -p pebbles-core --lib

  # ───────────────────────────────────────────────────────────────────────────
  # Font-pipeline fuzzing (11 S34) — the isolated cargo-fuzz crate (fuzz/, S32)
  # plus the long seeded mutation loop (S33). Weekly and on demand, NON-blocking:
  # a crash is triaged into an issue and a fixed S33 regression case.
  # ───────────────────────────────────────────────────────────────────────────
  fuzz-fonts:
    name: Font fuzzing (weekly)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Install nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Seed the font corpus from the bundled fonts
        run: mkdir -p fuzz/corpus/font_bytes && cp crates/pebbles-render/assets/fonts/*.ttf fuzz/corpus/font_bytes/
      # `+nightly`: rust-toolchain.toml pins stable (see the miri job).
      - run: cargo +nightly fuzz run font_bytes -- -max_total_time=600 -timeout=10
      - run: cargo +nightly fuzz run text_layout -- -max_total_time=600 -timeout=10
      - run: cargo test -p pebbles-gpu --release --test font_mutation -- --ignored
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
