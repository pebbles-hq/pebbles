# Scripted runs of the 08 §15 manual rows on real window systems (08 P12–P14, P19, P24–P27):
# hosted runners give a window server and a software or paravirtual GPU, not the owner's hardware
# rows (W1/M1/L1/L4), so these runs are recorded evidence that fills the CI-reachable part of the
# §17.8 table, not its sign-off. `scripts/desktop-run.py` documents each scenario and its checks.
# Manual dispatch only; results land in the job summary and the `desktop-runs-*` artifacts.
name: desktop runs

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios (space separated; see scripts/desktop-run.py)"
        default: "c1 c2 multi thread storm occ p14 minrestore p19 c5"
      c5_seconds:
        description: "C5 loss-injection run length (s); 08 §15 asks for 600"
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop runs (${{ matrix.row }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            row: Linux X11 (Xvfb + openbox) lavapipe Vulkan
            exe: ""
          - os: macos-latest
            row: macOS Metal (Apple Paravirtual device)
            exe: ""
          - os: windows-latest
            row: Windows DX12 (WARP)
            exe: .exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python deps
        run: python -m pip install --quiet pillow psutil
      - name: Linux display (Xvfb, openbox) and Mesa lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb xdotool imagemagick openbox x11-utils \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libegl-mesa0 libgl1-mesa-dri
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX +extension RANDR -nolisten tcp > /tmp/xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 1
          DISPLAY=:99 xdpyinfo | head -20
          DISPLAY=:99 xrandr --listmonitors || true
      - name: Windows session
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List
          query session 2>$null
          exit 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-runs
      - name: Build desktop + counter (soak profile = release + debug assertions, for the census)
        run: cargo build --profile soak -p desktop -p counter
      - name: Runs
        env:
          SCENARIOS: ${{ inputs.scenarios || 'c1 c2 multi thread storm occ p14 minrestore p19 c5' }}
          C5_SECONDS: ${{ inputs.c5_seconds || '600' }}
          ROW: ${{ matrix.row }}
          EXE: ${{ matrix.exe }}
        run: |
          set +e
          fails=0
          echo "## ${ROW}" >> "$GITHUB_STEP_SUMMARY"
          python --version
          run() { # scenario mode bin [extra args]
            local s=$1 m=$2 b=$3; shift 3
            echo "::group::$s ($m)"
            python scripts/desktop-run.py --scenario "$s" --mode "$m" --bin "target/soak/$b$EXE" \
              --out runs --row "$ROW" "$@"
            local rc=$?
            echo "::endgroup::"
            [ $rc -eq 0 ] || { echo "::warning::$s ($m) failed"; fails=$((fails+1)); }
          }
          for s in $SCENARIOS; do
            case $s in
              c1)
                run c1 inline desktop; run c1 threaded desktop
                if [ "$RUNNER_OS" = Linux ]; then
                  run c1 inline desktop --tag gl --env WGPU_BACKEND=gl --env LIBGL_ALWAYS_SOFTWARE=1
                fi ;;
              c2) run c2 inline desktop; run c2 threaded desktop ;;
              multi) run multi inline desktop; run multi threaded desktop ;;
              thread) run thread threaded desktop; run thread inline desktop ;;
              storm) run storm inline desktop; run storm threaded desktop ;;
              occ) # M-OCC rows are M1, M2, L2, L4 (08 §15.3); Windows does not report occlusion.
                if [ "$RUNNER_OS" != Windows ]; then run occ inline desktop; run occ threaded desktop; fi ;;
              p14) run p14 inline counter ;;
              minrestore) run minrestore inline counter; run minrestore threaded counter ;;
              p19) run p19 inline counter; run p19 threaded counter ;;
              p10) run p10 inline desktop; run p10 threaded desktop ;;
              c5) run c5 inline desktop --duration "$C5_SECONDS"; run c5 threaded desktop --duration "$C5_SECONDS" ;;
            esac
          done
          echo "failed scenarios: $fails"
          exit $([ $fails -eq 0 ] && echo 0 || echo 1)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-runs-${{ runner.os }}
          path: runs/
          retention-days: 30
          if-no-files-found: ignore

  # 08 §15 W-HIDPI / P13 AC2: the web canvas at devicePixelRatio 2 in headless Chrome.
  web-hidpi:
    name: web runs (W-HIDPI, headless Chrome dpr 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: trunk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web-hidpi
      - name: Build counter for the web with debug assertions (keeps the configure census)
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: cargo run -q -p pebbles-cli -- build -d web -p counter
      - name: W-HIDPI
        run: |
          # A Vulkan ICD (Mesa lavapipe): with `--enable-features=Vulkan` and none installed, the
          # GPU-less runner's Chrome has no shared-image backing for a WebGPU canvas swapchain and
          # destroys the device two frames after every configure (a rebuild loop, once a second).
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers
          python -m pip install --quiet playwright
          google-chrome --version
          python scripts/web-hidpi.py --dist examples/counter/dist --out runs
      - name: P04 AC1 (B7 Firefox WebGL context loss/restore)
        if: always()
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps firefox
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl-mesa0
          xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/web-context-loss.py --dist examples/counter/dist --out runs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-hidpi
          path: runs/
          retention-days: 30
          if-no-files-found: ignore
