# OpenSSF Scorecard — automated security health assessment of this repository
# (branch protection, pinned dependencies, dangerous workflow patterns, …).
# Docs: https://github.com/ossf/scorecard-action

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan — Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF results to GitHub Code Scanning
      security-events: write
      # OIDC token Scorecard uses to publish results
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # The default GITHUB_TOKEN cannot read branch-protection settings, which
          # makes that check error (-1). A PAT with repo/administration:read fixes
          # it — add a SCORECARD_TOKEN secret; falls back to github.token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
