name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep target/ lean on runners: no incremental caches, thin debuginfo.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The support matrix. This job IS the platform-support claim in the README:
  # a supported platform is one that builds and passes the headless suites
  # here. Tests need no window and no GPU, so they run on every runner.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cosmic-text's system-font lookup needs fontconfig headers; winit dlopens X11/Wayland at
      # runtime, so no display libs are needed to build or to run headless.
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      - name: cargo check (all targets, all features)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (headless suites)
        run: cargo test --workspace --all-features

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV — the `rust-version` in Cargo.toml is a promise; verify it compiles.
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # `check`, not `test`: the promise is that a 1.90 user can BUILD the
      # library, not that dev-dependencies hold the same floor.
      - name: Show the toolchain actually used (+1.90 overrides rust-toolchain.toml)
        run: cargo +1.90 --version && rustc +1.90 --version
      - run: cargo +1.90 check --workspace --all-features

  # ───────────────────────────────────────────────────────────────────────────
  # Cross-platform COMPILE gate. The whole stack — framework AND shell — compiles
  # for web, Android and iOS, and this keeps it that way: a change that breaks a
  # target's build fails CI. `cargo check` does not link, so this verifies
  # portability of the source + dependency graph (Android's cdylib/APK, the web
  # bundle, and the iOS .app are the separate build+run steps that need an
  # NDK / browser / Mac — see documentations/<platform>-support.md). Android uses
  # NativeActivity here because GameActivity's build script compiles C++ and needs
  # the NDK; a production Android build enables `android-game-activity`.
  # NOTE: `android-native-activity` and `android-game-activity` are MUTUALLY
  # EXCLUSIVE (they select conflicting winit android-activity backends), so this
  # job passes exactly ONE via `shell_args` and can never switch to
  # `--all-features` — enabling both at once fails to compile. Do not "simplify"
  # the android row to `--all-features`. See crates/pebbles/Cargo.toml.
  # ───────────────────────────────────────────────────────────────────────────
  cross-platform:
    name: Compile (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            shell_args: ""
          - target: aarch64-linux-android
            runner: ubuntu-latest
            shell_args: "--features android-native-activity"
          - target: aarch64-apple-ios
            runner: macos-latest
            shell_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xplatform-${{ matrix.target }}
      # The framework layer, in dependency order (so a break names the crate).
      - name: Framework compiles (foundation → render → core → widgets)
        run: |
          for c in pebbles-foundation pebbles-render pebbles-core pebbles-widgets; do
            echo "::group::$c"
            cargo check -p "$c" --target ${{ matrix.target }}
            echo "::endgroup::"
          done
      # The shell — window + GPU + clipboard + a11y + touch. This is the gate the
      # cross-platform port earned: it compiles for all three today.
      - name: Shell compiles (window / GPU / input)
        run: cargo check -p pebbles-shell --target ${{ matrix.target }} ${{ matrix.shell_args }}
      # Feature-gated integrations per target — these are exactly the combos that used to
      # break silently because this job passed no features: `file-dialogs` (rfd) on
      # android/ios and `tokio` on wasm. Both are now gated to a no-op on the wrong target.
      - name: file-dialogs compiles (rfd is desktop-only)
        run: cargo check -p pebbles-widgets --target ${{ matrix.target }} --features file-dialogs
      - name: umbrella + tokio on wasm (tokio is native-only → no-op here)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p pebbles --target ${{ matrix.target }} --features tokio
      # The examples are a claimed web run mode (`pebbles run -d web`). They were only
      # swept host-target before, so a web-breaking example change landed green. Gate
      # all seven on wasm so that can't happen.
      - name: Examples compile for wasm (web run mode)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          for ex in counter todo temperature stopwatch landing desktop mobile; do
            echo "::group::$ex"
            cargo check -p "$ex" --target ${{ matrix.target }}
            echo "::endgroup::"
          done

  # ───────────────────────────────────────────────────────────────────────────
  # Line coverage — NON-BLOCKING for now. Publishes a per-crate summary to the job
  # page so we can see which modules lack coverage; gate on a threshold later.
  # ───────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: Feature matrix (optional integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: feature-matrix
      - name: No default features, then every integration
        run: |
          set -euo pipefail
          cargo check -p pebbles --no-default-features
          cargo check -p pebbles --no-default-features --features image-view,file-dialogs,tokio,native-menus,global-hotkeys
      - name: The display-list core alone
        run: cargo check -p pebbles-render -p pebbles-gpu

  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - name: Coverage summary
        # `--ignore-run-fail`: still emit the coverage summary even if a test flakes
        # under llvm-cov's instrumentation (it slows the frame clock, which can trip a
        # timing-sensitive settle). Tests are gated by the real `Test` job, not here.
        run: |
          echo '## Coverage (`cargo llvm-cov`)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --all-features --ignore-run-fail --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  # The GPU path on Mesa lavapipe (05 V30): pebbles-gpu and the shell's capture / glyph /
  # render checks under strict validation. Promotion: 05 §10.5.
  gpu-wgpu-linux:
    name: wgpu GPU tests (Linux lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true   # removed at the Phase-C exit (05 §10.3)
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      WGPU_VALIDATION: "1"        # Khronos validation layer on (11 §4.6; S56 counts its errors)
      PEBBLES_EXPECT_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (fontconfig + Mesa lavapipe + Vulkan validation layers)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Point the Vulkan loader at lavapipe
        # Mesa names the ICD lvp_icd.x86_64.json in older releases and lvp_icd.json from 25.x
        # (noble-updates), so resolve it after the install instead of hard-coding either.
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$LVP" || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-wgpu-linux
      - name: Record the Vulkan device
        run: vulkaninfo --summary 2>/dev/null | grep -iE "deviceName|driverInfo|apiVersion" || true
      - name: TEST-GPU-GPU (pebbles-gpu)
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1
      - name: TEST-SHELL-GPU (capture / glyph / render checks on wgpu)
        run: cargo test -p pebbles-shell -- --ignored --test-threads=1

  # wgpu-core validation without a GPU on every OS (05 V38): the noop backend runs every GPU test's
  # calls through validation; pixel asserts are skipped under it (V09).
  gpu-noop-validation:
    name: wgpu validation, noop backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      WGPU_BACKEND: noop
      WGPU_NOOP_BACKEND: "1"
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-noop-${{ matrix.os }}
      - name: GPU tests under wgpu-core validation (no pixels)
        shell: bash
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1

  # Render check: golden model + probes + self-goldens, in-process (05 §6).
  render-check:
    name: Render check (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true   # removed at the Phase-5 gate (05 §12.3)
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      PEBBLES_RENDER_CHECK_PLATFORM: linux-lavapipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (fontconfig + Mesa lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev mesa-vulkan-drivers vulkan-tools
      - name: Point the Vulkan loader at lavapipe
        # Mesa names the ICD lvp_icd.x86_64.json in older releases and lvp_icd.json from 25.x
        # (noble-updates), so resolve it after the install instead of hard-coding either.
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$LVP" || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: render-check
      - name: Record the Vulkan device (Mesa version pins the canonical platform)
        run: vulkaninfo --summary 2>/dev/null | grep -iE "deviceName|driverInfo" || true
      - name: RENDER-CHECK
        run: cargo run -p render-check --release -- --out target/render-check --determinism
      - name: Report to the job summary
        if: always()
        run: cat target/render-check/linux-lavapipe/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-check-linux-lavapipe
          path: target/render-check/
          retention-days: 14
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
      # The backlog is burned down (0 warnings at HEAD), so the ratchet is now on:
      # `-D warnings` fails the build on any new clippy warning. Keep it green.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    # Blocking: the one-time reformat has landed, so the tree is fmt-clean and
    # stays that way. `cargo fmt --all` before pushing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    # Blocking: every intra-doc link resolves. This is the gate that catches the
    # doc rot module moves and renames cause — a link to a moved item is a
    # broken link, not a warning to skim past.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs
      - name: cargo doc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --workspace --no-deps --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
