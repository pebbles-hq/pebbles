name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on any branch (one-off checks, e.g. a deliberately failing lane, 05 V30 AC2).
  workflow_dispatch:
    inputs:
      write_refs:
        description: "Render check: also write candidate self-goldens (--write-refs) and upload them as the render-check-refs artifact (05 V12)"
        type: boolean
        default: false
      inject_vk_validation_error:
        description: "Lavapipe GPU lane: make one raw Vulkan call the validation layer rejects; the lane must go red (11 S56 AC2)"
        type: boolean
        default: false

# Least privilege by default; no job here needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep target/ lean on runners: no incremental caches, thin debuginfo.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The support matrix. This job IS the platform-support claim in the README:
  # a supported platform is one that builds and passes the headless suites
  # here. Tests need no window and no GPU, so they run on every runner.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      - name: cargo check (all targets, all features)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (headless suites)
        run: cargo test --workspace --all-features

  # ───────────────────────────────────────────────────────────────────────────
  # MSRV — the `rust-version` in Cargo.toml is a promise; verify it compiles.
  # ───────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # `check`, not `test`: the promise is that a 1.90 user can BUILD the
      # library, not that dev-dependencies hold the same floor.
      - name: Show the toolchain actually used (+1.90 overrides rust-toolchain.toml)
        run: cargo +1.90 --version && rustc +1.90 --version
      - run: cargo +1.90 check --workspace --all-features

  # ───────────────────────────────────────────────────────────────────────────
  # Cross-platform COMPILE gate. The whole stack — framework AND shell — compiles
  # for web, Android and iOS, and this keeps it that way: a change that breaks a
  # target's build fails CI. `cargo check` does not link, so this verifies
  # portability of the source + dependency graph (Android's cdylib/APK, the web
  # bundle, and the iOS .app are the separate build+run steps that need an
  # NDK / browser / Mac — see documentations/<platform>-support.md). Android uses
  # NativeActivity here because GameActivity's build script compiles C++ and needs
  # the NDK; a production Android build enables `android-game-activity`.
  # NOTE: `android-native-activity` and `android-game-activity` are MUTUALLY
  # EXCLUSIVE (they select conflicting winit android-activity backends), so this
  # job passes exactly ONE via `shell_args` and can never switch to
  # `--all-features` — enabling both at once fails to compile. Do not "simplify"
  # the android row to `--all-features`. See crates/pebbles/Cargo.toml.
  # ───────────────────────────────────────────────────────────────────────────
  cross-platform:
    name: Compile (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            shell_args: ""
          - target: aarch64-linux-android
            runner: ubuntu-latest
            shell_args: "--features android-native-activity"
          - target: aarch64-apple-ios
            runner: macos-latest
            shell_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xplatform-${{ matrix.target }}
      # The framework layer, in dependency order (so a break names the crate).
      - name: Framework compiles (foundation → render → core → widgets)
        run: |
          for c in pebbles-foundation pebbles-render pebbles-core pebbles-widgets; do
            echo "::group::$c"
            cargo check -p "$c" --target ${{ matrix.target }}
            echo "::endgroup::"
          done
      # The shell — window + GPU + clipboard + a11y + touch. This is the gate the
      # cross-platform port earned: it compiles for all three today.
      - name: Shell compiles (window / GPU / input)
        run: cargo check -p pebbles-shell --target ${{ matrix.target }} ${{ matrix.shell_args }}
      # Feature-gated integrations per target — these are exactly the combos that used to
      # break silently because this job passed no features: `file-dialogs` (rfd) on
      # android/ios and `tokio` on wasm. Both are now gated to a no-op on the wrong target.
      - name: file-dialogs compiles (rfd is desktop-only)
        run: cargo check -p pebbles-widgets --target ${{ matrix.target }} --features file-dialogs
      - name: umbrella + tokio on wasm (tokio is native-only → no-op here)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p pebbles --target ${{ matrix.target }} --features tokio
      # The examples are a claimed web run mode (`pebbles run -d web`). They were only
      # swept host-target before, so a web-breaking example change landed green. Gate
      # all seven on wasm so that can't happen.
      - name: Examples compile for wasm (web run mode)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          for ex in counter todo temperature stopwatch landing desktop mobile; do
            echo "::group::$ex"
            cargo check -p "$ex" --target ${{ matrix.target }}
            echo "::endgroup::"
          done
      # WASM-WGPU and WASM-WEBGL (05 V33, DR-13): the shell and the umbrella with WebGPU only, and
      # with the default-on WebGL2 fallback (the examples above already build that one).
      - name: WASM-WGPU (shell + umbrella, WebGPU only)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p pebbles-shell -p pebbles --target ${{ matrix.target }} --no-default-features
      - name: WASM-WEBGL (shell + umbrella, WebGPU + WebGL2 fallback)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check -p pebbles-shell -p pebbles --target ${{ matrix.target }}

  # ───────────────────────────────────────────────────────────────────────────
  # Wasm size (10 §12, M11): the counter example's raw cargo output, gzip-gated against
  # scripts/wasm-size-budget.txt. Lowering the budget is free; raising it needs a DR.
  # ───────────────────────────────────────────────────────────────────────────
  wasm-size:
    name: Wasm size (counter, WebGPU + WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm-size
      - name: Size check
        run: ./scripts/wasm-size.sh --check

  # ───────────────────────────────────────────────────────────────────────────
  # Line coverage — NON-BLOCKING for now. Publishes a per-crate summary to the job
  # page so we can see which modules lack coverage; gate on a threshold later.
  # ───────────────────────────────────────────────────────────────────────────
  feature-matrix:
    name: Feature matrix (optional integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: feature-matrix
      - name: No default features, then every integration
        run: |
          set -euo pipefail
          cargo check -p pebbles --no-default-features
          cargo check -p pebbles --no-default-features --features image-view,file-dialogs,tokio,native-menus,global-hotkeys
      - name: The display-list core alone
        run: cargo check -p pebbles-render -p pebbles-gpu

  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - name: Coverage summary
        # `--ignore-run-fail`: still emit the coverage summary even if a test flakes
        # under llvm-cov's instrumentation (it slows the frame clock, which can trip a
        # timing-sensitive settle). Tests are gated by the real `Test` job, not here.
        run: |
          echo '## Coverage (`cargo llvm-cov`)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --all-features --ignore-run-fail --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  # The GPU path on Mesa lavapipe (05 V30): pebbles-gpu and the shell's capture / glyph /
  # render checks under strict validation. Promotion: 05 §10.5.
  gpu-wgpu-linux:
    name: wgpu GPU tests (Linux lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      WGPU_VALIDATION: "1"        # Khronos validation layer on (11 §4.6; S56 counts its errors)
      # S56 AC2 negative check, manual dispatch only: robustness::injected_vulkan_validation_error_fails_the_test.
      PEBBLES_INJECT_VK_VALIDATION_ERROR: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_vk_validation_error && '1' || '0' }}
      PEBBLES_EXPECT_ADAPTER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Mesa lavapipe + Vulkan validation layers)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Point the Vulkan loader at lavapipe
        # Mesa names the ICD lvp_icd.x86_64.json in older releases and lvp_icd.json from 25.x
        # (noble-updates), so resolve it after the install instead of hard-coding either.
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$LVP" || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-wgpu-linux
      - name: Record the Vulkan device
        run: vulkaninfo --summary 2>/dev/null | grep -iE "deviceName|driverInfo|apiVersion" || true
      - name: Record the adapter (05 V30–V32, V37)
        run: cargo test -p pebbles-gpu --test gpu gpu_smoke::adapter_matches_expectation -- --ignored --nocapture
      - name: TEST-GPU-GPU (pebbles-gpu)
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1
      - name: TEST-SHELL-GPU (capture / glyph / render checks on wgpu)
        run: cargo test -p pebbles-shell -- --ignored --test-threads=1

  # Windows WARP (05 V31): the DX12 software adapter, shaders through Fxc (DR-13). Blocking since the
  # 2026-10-26 promotion (05 §10.5); render-check on WARP uses the relaxed limits (DR-09).
  gpu-wgpu-windows-warp:
    name: wgpu GPU tests (Windows WARP)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WGPU_BACKEND: dx12
      WGPU_DX12_COMPILER: fxc
      PEBBLES_CPU_RENDER: "1"
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      PEBBLES_EXPECT_ADAPTER: Microsoft Basic Render Driver
      PEBBLES_RENDER_CHECK_PLATFORM: windows-warp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-wgpu-windows-warp
      - name: Record the adapter (05 V30–V32, V37)
        run: cargo test -p pebbles-gpu --test gpu gpu_smoke::adapter_matches_expectation -- --ignored --nocapture
      - name: TEST-GPU-GPU on WARP
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1
      - name: TEST-SHELL-GPU on WARP
        run: cargo test -p pebbles-shell -- --ignored --test-threads=1
      - name: Golden test API on WARP (05 V54 AC1)
        run: cargo test -p pebbles-shell golden -- --include-ignored --test-threads=1
      - name: RENDER-CHECK on WARP (relaxed)
        run: cargo run -p render-check --release -- --out target/render-check --tolerance relaxed --determinism
      - name: RENDER-CHECK vs committed references (cross-backend)
        run: cargo run -p render-check --release -- --out target/render-check --reference dir --tolerance relaxed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-check-windows-warp
          path: target/render-check/
          retention-days: 14
          if-no-files-found: ignore

  # macOS Metal (05 V32). Hosted macOS runners are VMs; whether they expose a Metal adapter to wgpu
  # is unverified — if three runs find none, this becomes `if: false` and macOS stays manual (P02).
  gpu-wgpu-macos-metal:
    name: wgpu GPU tests (macOS Metal)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WGPU_BACKEND: metal
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      PEBBLES_EXPECT_ADAPTER: Apple
      PEBBLES_RENDER_CHECK_PLATFORM: macos-metal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-wgpu-macos-metal
      - name: Record the adapter (05 V30–V32, V37)
        run: cargo test -p pebbles-gpu --test gpu gpu_smoke::adapter_matches_expectation -- --ignored --nocapture
      - name: TEST-GPU-GPU on Metal
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1
      - name: TEST-SHELL-GPU on Metal
        run: cargo test -p pebbles-shell -- --ignored --test-threads=1
      - name: Golden test API on Metal (05 V54 AC1)
        run: cargo test -p pebbles-shell golden -- --include-ignored --test-threads=1
      - name: RENDER-CHECK on Metal (relaxed)
        run: cargo run -p render-check --release -- --out target/render-check --tolerance relaxed --determinism
      - name: RENDER-CHECK vs committed references (cross-backend)
        run: cargo run -p render-check --release -- --out target/render-check --reference dir --tolerance relaxed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-check-macos-metal
          path: target/render-check/
          retention-days: 14
          if-no-files-found: ignore

  # Linux llvmpipe GL (05 V37): wgpu's GL backend through surfaceless EGL — the closest automated
  # proxy for WebGL2 (not the WebGL2 release gate: that is P01/P02 + V33).
  gpu-wgpu-linux-gl:
    name: wgpu GPU tests (Linux llvmpipe GL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WGPU_BACKEND: gl
      LIBGL_ALWAYS_SOFTWARE: "1"
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      PEBBLES_EXPECT_ADAPTER: llvmpipe
      PEBBLES_RENDER_CHECK_PLATFORM: linux-gl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Mesa EGL/GLES)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-wgpu-linux-gl
      - name: Record the adapter (05 V30–V32, V37)
        run: cargo test -p pebbles-gpu --test gpu gpu_smoke::adapter_matches_expectation -- --ignored --nocapture
      - name: gpu_formats on GL (05 V37 AC2, prints the sRGB-view SKIP)
        run: cargo test -p pebbles-gpu --test gpu gpu_formats -- --ignored --nocapture --test-threads=1
      - name: TEST-GPU-GPU on GL
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1
      - name: RENDER-CHECK vs committed references (cross-backend)
        run: cargo run -p render-check --release -- --out target/render-check --reference dir --tolerance relaxed

  # Headless-browser smoke of the web build on the WebGL2 path (05 V50, DR-27): counter in headless
  # Chrome on SwiftShader with ?pebbles-force-webgl=1 must log `GPU: … backend=gl` and not panic.
  web-smoke:
    name: Web smoke (counter, WebGL2, headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # informative (DR-27)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: trunk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web-smoke
      - name: Web smoke
        run: bash scripts/web-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-smoke-chrome-log
          path: chrome.log
          retention-days: 14
          if-no-files-found: ignore

  # wgpu-core validation without a GPU on every OS (05 V38): the noop backend runs every GPU test's
  # calls through validation; pixel asserts are skipped under it (V09).
  gpu-noop-validation:
    name: wgpu validation, noop backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      WGPU_BACKEND: noop
      WGPU_NOOP_BACKEND: "1"
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gpu-noop-${{ matrix.os }}
      - name: GPU tests under wgpu-core validation (no pixels)
        shell: bash
        run: cargo test -p pebbles-gpu -- --ignored --test-threads=1

  # Render check: golden model + probes + self-goldens, in-process (05 §6).
  # Linux desktop smoke under X11 (checklist §2): the `desktop` and `counter` examples on Xvfb +
  # openbox with WAYLAND_DISPLAY unset, so winit's X11 backend (XIM, X11 cursors, WM-drawn
  # decorations, WM_CLASS) is the one exercised. Pebbles has no desktop-environment-specific
  # code: windowing, decorations, IME, clipboard and cursors come from winit / arboard /
  # AccessKit. Checks: first frame presented, `window system: x11`, GPU line, no panic, no ERROR,
  # frames rendered inline and threaded, idle costs no frames.
  desktop-smoke-x11:
    name: Desktop smoke (Linux X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Mesa lavapipe, Xvfb + openbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb openbox x11-utils xdotool imagemagick \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libegl1 libegl-mesa0 libgl1-mesa-dri \
            python3-psutil python3-pil
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$LVP" || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - name: X11 session (Xvfb + openbox)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX +extension RANDR -nolisten tcp > /tmp/xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 1
          DISPLAY=:99 xdpyinfo | head -5
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-smoke
      - name: Build desktop + counter
        run: cargo build -p desktop -p counter
      - name: Smoke runs
        run: |
          unset WAYLAND_DISPLAY # winit prefers Wayland when it is set
          fails=0
          run() { # scenario mode bin
            echo "::group::$1 ($2, $3)"
            python3 scripts/desktop-run.py --scenario "$1" --mode "$2" --bin "target/debug/$3" --out runs \
              --row "Linux X11 (CI, lavapipe)" --expect-session x11 || { echo "::error::$1 ($2) failed"; fails=$((fails+1)); }
            echo "::endgroup::"
          }
          run c1 inline desktop
          run c1 threaded desktop
          run idle inline counter
          exit $fails
      - name: Session logs
        if: failure()
        run: tail -n 50 /tmp/xvfb.log /tmp/openbox.log 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-smoke-x11
          path: runs/
          retention-days: 14
          if-no-files-found: ignore

  render-check:
    name: Render check (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      PEBBLES_REQUIRE_GPU: "1"
      PEBBLES_GPU_STRICT: "1"
      PEBBLES_RENDER_CHECK_PLATFORM: linux-lavapipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System deps (Mesa lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Point the Vulkan loader at lavapipe
        # Mesa names the ICD lvp_icd.x86_64.json in older releases and lvp_icd.json from 25.x
        # (noble-updates), so resolve it after the install instead of hard-coding either.
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$LVP" || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: render-check
      - name: Record the Vulkan device (Mesa version pins the canonical platform)
        run: vulkaninfo --summary 2>/dev/null | grep -iE "deviceName|driverInfo" || true
      - name: RENDER-CHECK
        run: cargo run -p render-check --release -- --out target/render-check --determinism
      # 05 V36 step 2: every in_refs case against the committed self-goldens (V12).
      - name: RENDER-CHECK (committed references)
        run: cargo run -p render-check --release -- --out target/render-check-dir --reference dir --determinism
      # 05 V12 step 2: regenerate the self-goldens on the canonical runner (manual dispatch only).
      - name: RENDER-CHECK --write-refs (manual, 05 V12)
        if: github.event_name == 'workflow_dispatch' && inputs.write_refs
        run: cargo run -p render-check --release -- --out target/render-check-write --write-refs target/render-check-refs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.write_refs
        with:
          name: render-check-refs
          path: target/render-check-refs/
          retention-days: 14
          if-no-files-found: error
      - name: Report to the job summary
        if: always()
        run: cat target/render-check/linux-lavapipe/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-check-linux-lavapipe
          path: target/render-check/
          retention-days: 14
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
      # The backlog is burned down (0 warnings at HEAD), so the ratchet is now on:
      # `-D warnings` fails the build on any new clippy warning. Keep it green.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    # Blocking: the one-time reformat has landed, so the tree is fmt-clean and
    # stays that way. `cargo fmt --all` before pushing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    # Blocking: every intra-doc link resolves. This is the gate that catches the
    # doc rot module moves and renames cause — a link to a moved item is a
    # broken link, not a warning to skim past.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs
      - name: cargo doc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --workspace --no-deps --all-features

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
