[package]
name = "pebbles-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Pebbles developer CLI: scaffold projects, run with hot-restart, and stream dev logs."

# The binary is `pebbles` even though the crate is `pebbles-cli` (the crate name
# `pebbles` is taken by the umbrella library). `cargo install --path .` puts a
# `pebbles` on PATH.
[[bin]]
name = "pebbles"
path = "src/main.rs"
# No rustdoc for the CLI: a binary has no API surface to document, and because
# this bin is *named* `pebbles` its doc output would land in target/doc/pebbles/
# — the same directory as the `pebbles` LIBRARY crate. That collision is a race:
# locally it is only a warning, but in CI the library's pages get clobbered
# mid-write and `cargo doc` dies on a missing file.
doc = false

# Intentionally dependency-free: std-only (hand-rolled arg parsing, poll-based
# file watching, std::process). Keeps `pebbles` install fast and portable.

[lints]
workspace = true
