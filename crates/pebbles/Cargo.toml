[package]
name = "pebbles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Pebbles — a GUI framework for Rust built from handpicked ideas: Flutter-style widgets, SolidJS-style reactivity, Tailwind-style styling, and pure-Rust Vello rendering. The umbrella crate + prelude."

[dependencies]
pebbles-foundation.workspace = true
pebbles-render.workspace = true
pebbles-core.workspace = true
pebbles-widgets.workspace = true
pebbles-shell.workspace = true
pebbles-macros.workspace = true

[features]
# Render backend, forwarded through the whole graph (wgpu migration): `vello-hybrid` is the
# default; the first-party `wgpu` renderer is opt-in via `--no-default-features --features wgpu`.
# With both enabled, `vello-hybrid` wins until the Phase-6 flip. The offscreen `capture` API
# works off-wasm under either backend.
default = ["vello-hybrid"]
wgpu = [
    "pebbles-render/wgpu",
    "pebbles-core/wgpu",
    "pebbles-widgets/wgpu",
    "pebbles-shell/wgpu",
]
vello-hybrid = [
    "pebbles-render/vello-hybrid",
    "pebbles-core/vello-hybrid",
    "pebbles-widgets/vello-hybrid",
    "pebbles-shell/vello-hybrid",
]
# Forward the shell's optional integrations so apps can opt in via the umbrella,
# e.g. `cargo run -p todo --features pebbles/native-menus`.
native-menus = ["pebbles-shell/native-menus"]
global-hotkeys = ["pebbles-shell/global-hotkeys"]
# Forward the widget catalog's optional integrations the same way.
image-view = ["pebbles-widgets/image-view"]
file-dialogs = ["pebbles-widgets/file-dialogs"]
# Forward the runtime's optional tokio integration (`create_resource_future`,
# `spawn_future`) — the README advertises it, so the umbrella must expose it.
tokio = ["pebbles-core/tokio"]
# Forward the Android base-class selection (winit needs exactly one on Android).
# `pebbles run -d android` passes native-activity (NDK-only, no Gradle); GameActivity
# is the production step-up (soft keyboard, needs the AAR). See android-support.md.
# These two are MUTUALLY EXCLUSIVE — enabling both selects conflicting winit
# android-activity backends and fails to compile. Pick exactly one; this is why the
# cross-platform CI job cannot use `--all-features` (see .github/workflows/ci.yml).
android-native-activity = ["pebbles-shell/android-native-activity"]
android-game-activity = ["pebbles-shell/android-game-activity"]
# NOTE: Markdown moved to its own package, `pebbles-markdown` — add it alongside
# `pebbles` in your app's deps (it depends on this catalog, not the reverse).

[lints]
workspace = true

# docs.rs builds with every feature so the feature-gated API (ImageView, hotkeys, create_resource_future, offscreen capture) appears. During the wgpu migration --all-features resolves to vello-hybrid (DR-10), so this is safe.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
