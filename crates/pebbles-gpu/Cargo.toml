[package]
name = "pebbles-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "The first-party wgpu 2D renderer for Pebbles: display-list preparation and GPU execution. Implementation crate — apps use pebbles::shell."

[dependencies]
pebbles-foundation.workspace = true
# Display-list types ONLY. NEVER add features here — enabling a pebbles-render feature
# from pebbles-gpu would flip the shell's backend through Cargo feature unification.
pebbles-render.workspace = true
wgpu.workspace = true
kurbo.workspace = true
peniko.workspace = true
lyon_tessellation.workspace = true
bytemuck.workspace = true
web-time.workspace = true
swash.workspace = true
skrifa.workspace = true   # COLR paint graphs (02 R29, DR-23)
guillotiere.workspace = true
zeno.workspace = true
half.workspace = true    # f16 gradient LUT texels (09 §5.3, L37)

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
pollster.workspace = true
# V02: validate every shader and translate it to GLSL ES 300 (WebGL2) in CPU tests.
naga = { version = "29.0.4", features = ["wgsl-in", "glsl-out", "hlsl-out", "msl-out"] }
swash.workspace = true

[lints]
workspace = true
