[package]
name = "pebbles-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "The first-party wgpu 2D renderer for Pebbles: display-list preparation and GPU execution. Implementation crate — apps use pebbles::shell."

[features]
# WebGL2 fallback on wasm32 (wgpu's GL backend). Inert on native targets.
webgl = ["wgpu/webgl"]

[dependencies]
pebbles-foundation.workspace = true
# Display-list types ONLY. NEVER add features here — enabling a pebbles-render feature
# from pebbles-gpu would flip the shell's backend through Cargo feature unification.
pebbles-render.workspace = true
wgpu.workspace = true
kurbo.workspace = true
peniko.workspace = true
lyon_tessellation.workspace = true
bytemuck.workspace = true
web-time.workspace = true
swash.workspace = true
skrifa.workspace = true   # COLR paint graphs (02 R29, DR-23)
guillotiere.workspace = true
zeno.workspace = true
log.workspace = true     # added by S56: wgpu/naga records -> pebbles_foundation::log
half.workspace = true    # f16 gradient LUT texels (09 §5.3, L37)

# L43: app shader brushes are validated (and translated to GLSL ES for WebGL2) before use.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }  # P09: diagnostics to the browser console

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
pollster.workspace = true
# V02: validate every shader and translate it to GLSL ES 300 (WebGL2) in CPU tests.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out", "hlsl-out", "msl-out"] }
swash.workspace = true
# V09: validation-only GPU runs (`WGPU_BACKEND=noop WGPU_NOOP_BACKEND=1`); test builds only.
wgpu = { workspace = true, features = ["noop"] }

# S56 AC2: the dispatch-only validation-error injection drives one raw Vulkan call (already in
# Cargo.lock through wgpu-hal; same version, no new package).
[target.'cfg(target_os = "linux")'.dev-dependencies]
ash = "0.38"

[lints]
workspace = true
