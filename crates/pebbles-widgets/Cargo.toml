[package]
name = "pebbles-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Pebbles catalog: Flutter-style widgets, shadcn-style components, theme and styling."

[features]
# Render backend, forwarded to pebbles-render + pebbles-core. `vello-hybrid` is the
# default; `vello` (GPU compute) is opt-in.
default = ["vello-hybrid"]
vello = ["pebbles-render/vello", "pebbles-core/vello"]
vello-hybrid = ["pebbles-render/vello-hybrid", "pebbles-core/vello-hybrid"]
# `ImageView` + `image_from_bytes`/`image_from_path` (pulls in the image codecs and,
# for `ImageView::network`, a blocking HTTP client). Avatar `src` URLs degrade to the
# initials face without it.
image-view = [
    "dep:image",
    "dep:base64",
    "dep:ureq",
    # web network loading (browser fetch); target-gated, inert on native.
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
# `pick_folder` — the native OS folder picker (pulls in rfd + an async runtime on Linux).
file-dialogs = ["dep:rfd"]
# NOTE: the Markdown reader/editor now lives in its OWN package,
# `pebbles-markdown` (github.com/pebbles-hq/pebbles-markdown) — the reference
# third-party Pebbles widget crate. It depends on this catalog; the catalog does
# NOT depend on it.

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
base64 = { version = "0.22", optional = true }
pebbles-core.workspace = true
pebbles-foundation.workspace = true
pebbles-render.workspace = true
# wasm-safe clock for the calendar's "today" (std::time::SystemTime panics on wasm).
web-time.workspace = true

# Native-only optional deps behind `image-view` / `file-dialogs`. `ureq` is a
# blocking HTTP client and `rfd` (xdg-portal + async-std) is a desktop dialog — on
# the web neither applies: network image loads go through the browser's fetch (below)
# and a folder picker is an `<input type=file>`. Gating them here keeps
# `ring`/`getrandom`/GTK off the wasm build entirely.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", optional = true }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "async-std"], optional = true }

# Web `image-view` network loading: the browser's own `fetch` + ArrayBuffer readback,
# decoded by the same pure-Rust `image` codecs. These replace `ureq` on wasm.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Response"] }

[lints]
workspace = true

[dev-dependencies]
pebbles-testing.workspace = true
