[package]
name = "pebbles-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Pebbles catalog: Flutter-style widgets, shadcn-style components, theme and styling."

[features]
default = []
# `ImageView` + `image_from_bytes`/`image_from_path` (pulls in the image codecs and,
# for `ImageView::network`, a blocking HTTP client). Avatar `src` URLs degrade to the
# initials face without it.
image-view = ["dep:image", "dep:ureq", "dep:base64"]
# `pick_folder` — the native OS folder picker (pulls in rfd + an async runtime on Linux).
file-dialogs = ["dep:rfd"]
# The Markdown reader/editor (`markdown`, `markdown_editor`) — pulls in the
# pulldown-cmark GFM parser (the one behind rustdoc/mdbook).
markdown = ["dep:pulldown-cmark"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
ureq = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
pebbles-core.workspace = true
pebbles-foundation.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
pebbles-render.workspace = true

[lints]
workspace = true
