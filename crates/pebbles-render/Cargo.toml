[package]
name = "pebbles-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "The render layer for Pebbles: box constraints, the render tree, layout, painting and text."

[dependencies]
pebbles-foundation.workspace = true
pebbles-icons.workspace = true
# wasm-safe clock for dev-log throttles (std::time::Instant panics on wasm).
web-time.workspace = true
# The two swappable rasterizer backends, selected by the features below. Both are
# optional; the paint seam (`paint/mod.rs`) compiles exactly one. The geometry/brush
# vocabulary (`kurbo`/`peniko`) is backend-neutral and always present, so the widget
# layer imports it directly and never names a backend.
#  · vello_hybrid + vello_common → the hybrid backend's retained op-list records
#    against these, and `Scene::flush` walks it into a live `vello_hybrid::Scene`
#    (the shell then rasterizes that on the GPU). `text` pulls in glyph runs;
#    `glifo` is named directly for the `Glyph` type the flush feeds `fill_glyphs`.
vello_hybrid = { workspace = true, optional = true }
vello_common = { workspace = true, optional = true }
glifo = { version = "0.3", optional = true }
peniko.workspace = true
kurbo.workspace = true
parley.workspace = true
slotmap.workspace = true
smallvec = { workspace = true, features = ["union"] }
lyon = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
# Exactly ONE backend must be on. `vello-hybrid` is the default; `wgpu` (first-party)
# is opt-in. `vello-hybrid` wins whenever it is enabled (DR-10); select wgpu with
# `--no-default-features --features wgpu`. The seam is paint/mod.rs.
default = ["vello-hybrid"]
wgpu = ["dep:lyon", "dep:bytemuck"]
vello-hybrid = ["dep:vello_hybrid", "vello_hybrid/text", "dep:vello_common", "dep:glifo"]

[lints]
workspace = true
