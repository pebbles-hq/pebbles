[package]
name = "pebbles-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "The render layer for Pebbles: box constraints, the render tree, layout, painting and text."

[dependencies]
pebbles-foundation.workspace = true
pebbles-icons.workspace = true
# wasm-safe clock for dev-log throttles (std::time::Instant panics on wasm).
web-time.workspace = true
peniko.workspace = true
kurbo.workspace = true
# Text (03 §3.10) — NON-optional: text is backend-neutral (DR-08).
cosmic-text.workspace = true
unicode-segmentation.workspace = true
sys-locale.workspace = true
slotmap.workspace = true
smallvec = { workspace = true, features = ["union"] }

[target.'cfg(target_family = "wasm")'.dependencies]
cosmic-text = { workspace = true, features = ["wasm-web"] } # sys-locale reads navigator.language
sys-locale = { workspace = true, features = ["js"] }

[lints]
workspace = true
