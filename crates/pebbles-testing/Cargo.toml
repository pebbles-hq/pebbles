[package]
name = "pebbles-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Headless test harness for Pebbles apps and widgets: mount, frame, paint, dispatch, query."

[dependencies]
pebbles-core.workspace = true
pebbles-foundation.workspace = true
pebbles-render.workspace = true
pebbles-widgets.workspace = true

[features]
# Render backend, forwarded to the backend-selectable crates. `vello-hybrid` is default.
default = ["vello-hybrid"]
vello = ["pebbles-render/vello", "pebbles-core/vello", "pebbles-widgets/vello"]
vello-hybrid = [
    "pebbles-render/vello-hybrid",
    "pebbles-core/vello-hybrid",
    "pebbles-widgets/vello-hybrid",
]

[lints]
workspace = true
