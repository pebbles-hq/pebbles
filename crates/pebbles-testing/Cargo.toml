[package]
name = "pebbles-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Headless test harness for Pebbles apps and widgets: mount, frame, paint, dispatch, query."

[dependencies]
pebbles-core.workspace = true
pebbles-foundation.workspace = true
pebbles-render.workspace = true
pebbles-widgets.workspace = true

[features]
# Render backend, forwarded to the backend-selectable crates. `vello-hybrid` is the default; `wgpu` is opt-in (wgpu migration).
default = ["vello-hybrid"]
wgpu = ["pebbles-render/wgpu", "pebbles-core/wgpu", "pebbles-widgets/wgpu"]
vello-hybrid = [
    "pebbles-render/vello-hybrid",
    "pebbles-core/vello-hybrid",
    "pebbles-widgets/vello-hybrid",
]

[lints]
workspace = true
