[package]
name = "pebbles-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "The Pebbles runtime: Widget/Element traits, the reconciling engine, and SolidJS-style reactivity."

[dependencies]
pebbles-foundation.workspace = true
pebbles-render.workspace = true
slotmap.workspace = true
smallvec.workspace = true
# wasm-safe clock for scroll/fling timing (std::time::SystemTime panics on wasm).
web-time.workspace = true
# Web: `spawn` runs background work on the microtask queue (no OS threads on wasm).
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4"

# F3 — optional async: a lazy multi-thread tokio runtime behind the `tokio` feature
# (default off). NATIVE-ONLY — tokio's `rt-multi-thread` hard-`compile_error!`s on wasm and
# task.rs builds a multi-thread runtime, so the dep (and its module + re-exports) are gated
# off wasm. `--features tokio` on wasm is therefore a no-op, not a build break.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread"] }

[features]
# Render backend, forwarded to pebbles-render. `vello-hybrid` is the default.
# `vello-hybrid` (low-power) is default; `vello` opt-in. (Core has no backend-specific
# code — it just needs pebbles-render to have one selected.)
default = ["vello-hybrid"]
vello = ["pebbles-render/vello"]
vello-hybrid = ["pebbles-render/vello-hybrid"]
tokio = ["dep:tokio"]

[lints]
workspace = true
