# cargo-deny configuration — licenses, advisories, and duplicate-version hygiene.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # option groups in the wgpu/winit graph
    "CC0-1.0",
    "OFL-1.1",       # bundled fonts
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
