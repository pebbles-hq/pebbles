# cargo-deny configuration — licenses, advisories, and duplicate-version hygiene.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true
# Restrict the graph to the platforms Pebbles actually supports. Without this,
# cargo-deny unions EVERY target, which drags in muda's Linux GTK stack (gtk →
# glib → proc-macro-error, all unmaintained) even though it is never built:
# `muda` is target-gated to macOS/Windows, and there it uses the native menu
# APIs rather than GTK. Scoping the graph makes the advisory report reflect what
# we ship instead of a union that no build ever produces.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The example crates (counter, gallery) are `publish = false` and carry no
# license field; they are not distributed, so do not gate on them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # option groups in the wgpu/winit graph
    "BSL-1.0",       # error-code, via arboard's Windows clipboard backend
    "CC0-1.0",
    "OFL-1.1",       # bundled fonts
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
