# cargo-deny configuration — licenses, advisories, and duplicate-version hygiene.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true
# Restrict the graph to the platforms Pebbles actually supports. Without this,
# cargo-deny unions EVERY target, which drags in muda's Linux GTK stack (gtk →
# glib → proc-macro-error, all unmaintained) even though it is never built:
# `muda` is target-gated to macOS/Windows, and there it uses the native menu
# APIs rather than GTK. Scoping the graph makes the advisory report reflect what
# we ship instead of a union that no build ever produces.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    # web is a supported platform (WebGPU + WebGL2 fallback)
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"
# `unmaintained` advisories on TRANSITIVE dependencies we do not control. None
# is a vulnerability (cargo-audit, which gates on vulnerabilities, passes) — they
# are maintenance notices, and gating merges on them would train people to
# ignore the job. Listed explicitly so each stays visible and reviewable rather
# than being blanket-disabled.
ignore = [
    # proc-macro-error — an unmaintained build-time proc-macro dependency
    # (build-time only; never linked into a shipped binary). A maintenance notice,
    # not a vulnerability. (The gtk-rs GTK3 ignores that used to sit here were
    # pruned once `cargo deny` reported them advisory-not-detected — muda no
    # longer pulls that stack on any supported target.)
    "RUSTSEC-2024-0370",
    # ttf-parser — unmaintained (RUSTSEC-2026-0192; a maintenance notice, no known
    # vulnerability, no patched release). Reached on the PRIMARY font path: fontdb 0.23
    # (cosmic-text's font database) parses every bundled font, every `App::font` /
    # `fonts::register_user_font` byte slice and, on desktop, every system font; also via
    # ab_glyph <- sctk-adwaita <- winit (Wayland client-side decorations).
    # Accepted for this release because fonts are TRUSTED input (SECURITY.md "Renderer & fonts").
    # Mitigations: font fuzz targets (fuzz/, weekly) + seeded font-mutation tests (every CI run).
    # Revisit when cosmic-text/fontdb move off ttf-parser.
    "RUSTSEC-2026-0192",
    # zvariant / zvariant_derive / zbus_names — unmaintained as standalone crates
    # (RUSTSEC-2026-0370/0371/0372; maintenance notices, no vulnerability): merged into
    # zbus 6. Reached via accesskit_unix <- accesskit_winit (Linux AT-SPI accessibility);
    # no safe upgrade until accesskit moves to zbus 6. Revisit on the next accesskit bump.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# The example crates (counter, todo, temperature, stopwatch, mobile, desktop, landing) are
# `publish = false` and carry no license field; they are not distributed, so do not gate on them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",           # ring / rustls-webpki / untrusted (TLS) + libloading (GPU loader)
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # option groups in the wgpu/winit graph
    "BSL-1.0",       # error-code, via arboard's Windows clipboard backend
    "CDLA-Permissive-2.0", # webpki-roots — Mozilla's CA bundle, via ureq
    "CC0-1.0",
    "OFL-1.1",       # bundled fonts
    "Ubuntu-font-1.0",
]

[bans]
deny = [
    { crate = "rustybuzz", reason = "unmaintained (RUSTSEC-2026-0206); cosmic-text 0.19 shapes with harfrust" },
    # The removed renderer and text stack (wgpu migration): Pebbles renders with pebbles-gpu.
    { crate = "vello", reason = "Pebbles renders with its own wgpu renderer (wgpu migration)" },
    { crate = "vello_cpu", reason = "see vello" },
    { crate = "vello_hybrid", reason = "see vello" },
    { crate = "vello_common", reason = "see vello" },
    { crate = "vello_encoding", reason = "see vello" },
    { crate = "vello_shaders", reason = "see vello" },
    { crate = "vello_sparse_shaders", reason = "see vello" },
    { crate = "glifo", reason = "see vello" },
    { crate = "parley", reason = "text is cosmic-text" },
    { crate = "fontique", reason = "text is cosmic-text (fontdb)" },
]
multiple-versions = "warn"
wildcards = "deny"
# …but allow a *path* dependency to omit a version. `pebbles-widgets`' dev-dep on
# `pebbles-testing` is declared path-only (no `version`) on purpose, so `cargo package`
# strips it and the two crates don't deadlock on first crates.io publish. A path dep is
# never fetched from a registry, so its missing version isn't the supply-chain risk
# `wildcards = "deny"` guards against.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
