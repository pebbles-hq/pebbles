# cargo-deny configuration — licenses, advisories, and duplicate-version hygiene.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true
# Restrict the graph to the platforms Pebbles actually supports. Without this,
# cargo-deny unions EVERY target, which drags in muda's Linux GTK stack (gtk →
# glib → proc-macro-error, all unmaintained) even though it is never built:
# `muda` is target-gated to macOS/Windows, and there it uses the native menu
# APIs rather than GTK. Scoping the graph makes the advisory report reflect what
# we ship instead of a union that no build ever produces.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# `unmaintained` advisories on TRANSITIVE dependencies we do not control. None
# is a vulnerability (cargo-audit, which gates on vulnerabilities, passes) — they
# are maintenance notices, and gating merges on them would train people to
# ignore the job. Listed explicitly so each stays visible and reviewable rather
# than being blanket-disabled.
ignore = [
    # proc-macro-error — an unmaintained build-time proc-macro dependency
    # (build-time only; never linked into a shipped binary). A maintenance notice,
    # not a vulnerability. (The gtk-rs GTK3 ignores that used to sit here were
    # pruned once `cargo deny` reported them advisory-not-detected — muda no
    # longer pulls that stack on any supported target.)
    "RUSTSEC-2024-0370",
    # ttf-parser, via ab_glyph <- sctk-adwaita <- winit (Wayland client-side
    # decorations). This one IS built on Linux. Font PARSING of untrusted files
    # would matter, but this path only renders winit's own title-bar text, and
    # the fix belongs upstream in winit's decoration stack.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# The example crates (counter, todo, temperature, stopwatch, mobile, desktop, landing) are
# `publish = false` and carry no license field; they are not distributed, so do not gate on them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",           # ring / rustls-webpki / untrusted (TLS) + libloading (GPU loader)
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",       # option groups in the wgpu/winit graph
    "BSL-1.0",       # error-code, via arboard's Windows clipboard backend
    "CDLA-Permissive-2.0", # webpki-roots — Mozilla's CA bundle, via ureq
    "CC0-1.0",
    "OFL-1.1",       # bundled fonts
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# …but allow a *path* dependency to omit a version. `pebbles-widgets`' dev-dep on
# `pebbles-testing` is declared path-only (no `version`) on purpose, so `cargo package`
# strips it and the two crates don't deadlock on first crates.io publish. A path dep is
# never fetched from a registry, so its missing version isn't the supply-chain risk
# `wildcards = "deny"` guards against.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
