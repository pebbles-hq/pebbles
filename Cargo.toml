[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tools/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Reyco Seguma"]
repository = "https://github.com/pebbles-hq/pebbles"
homepage = "https://github.com/pebbles-hq/pebbles"
description = "Pebbles — a GUI framework for Rust built from handpicked ideas: a widget model in the spirit of Flutter, reactivity in the spirit of SolidJS, styling in the spirit of Tailwind, and pure-Rust GPU rendering on Vello."
keywords = ["gui", "ui", "graphics", "vello", "flutter"]
categories = ["gui", "graphics", "rendering"]

# Warn-only shared lints (CI ratchets with `-D warnings` once the debt is measured;
# never bake `deny` into the manifest). Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# NOT `unsafe_code = "forbid"`: pebbles-shell's native_menu.rs has one justified FFI block,
# and pebbles-macros emits `#[unsafe(no_mangle)]` into generated Android entry code. The
# reactive runtime contains no unsafe.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# leftovers that always escape into GUI codebases:
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# the two perf footguns that matter in a per-frame hot path:
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"

[workspace.dependencies]
# --- internal crates (bottom-up: foundation → render → core → widgets → shell → umbrella) ---
pebbles-foundation = { path = "crates/pebbles-foundation", version = "0.0.1" }
pebbles-icons = { path = "crates/pebbles-icons", version = "0.0.1" }
# The backend-selectable crates carry `default-features = false` so the render backend
# (`vello-hybrid` or `wgpu` during the wgpu migration) is chosen by the crate being built
# and forwarded DOWN (each crate re-enables its own `default`, so a plain build is unchanged).
pebbles-render = { path = "crates/pebbles-render", version = "0.0.1", default-features = false }
pebbles-core = { path = "crates/pebbles-core", version = "0.0.1", default-features = false }
pebbles-widgets = { path = "crates/pebbles-widgets", version = "0.0.1", default-features = false }
pebbles-shell = { path = "crates/pebbles-shell", version = "0.0.1", default-features = false }
pebbles-macros = { path = "crates/pebbles-macros", version = "0.0.1" }
pebbles = { path = "crates/pebbles", version = "0.0.1", default-features = false }
pebbles-testing = { path = "crates/pebbles-testing", version = "0.0.1", default-features = false }
pebbles-gpu = { path = "crates/pebbles-gpu", version = "0.0.1" }

# --- Linebender 2D stack ---
# `kurbo` (geometry) and `peniko` (brushes/colors) are the renderer-neutral paint
# vocabulary (DR-01). `vello`, `vello_hybrid` and `vello_common` serve ONLY the
# transitional `vello-hybrid` backend (the transitional smoke reference) and are deleted at Phase 7
# of the wgpu migration; the hybrid host still uses `vello::util` for surface plumbing.
vello = { version = "0.10", default-features = false }
vello_hybrid = { version = "0.2", default-features = false }
vello_common = { version = "0.2", default-features = false }
peniko = "0.6"
kurbo = "0.13"
parley = "0.11"

# --- text (pebbles-render only; DR-08) ---
# No `swash` feature (text never rasterizes; pebbles-gpu depends on swash directly, DR-07) and no `peniko` (03 §3.10: as_peniko()
# mints a new Blob per face); fontdb is re-exported as cosmic_text::fontdb, so no crate names
# fontdb directly. wasm adds `wasm-web` per crate. If T04 already wrote this line, keep it.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig"] }
unicode-segmentation = "1.12"
sys-locale = "0.3"

# --- renderer (pebbles-gpu only; DR-03) ---
lyon_tessellation = "1.0"
swash = "0.2.10"
# COLR paint graphs (02 R29, DR-23); the version swash/parley already lock.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
zeno = "0.3"
half = "2.7"
guillotiere = "0.7"

# --- windowing / gpu (shell only) ---
wgpu = "29"
winit = "0.30"
raw-window-handle = "0.6"
pollster = "1"
# A std::time drop-in that also works on wasm: on native it IS std::time (zero
# cost); on wasm `Instant`/`SystemTime` use `performance.now()`/`Date.now()`
# instead of panicking ("time not implemented on this platform"). Every crate that
# times anything at runtime uses THIS, never `std::time::{Instant,SystemTime}`.
web-time = "1.1"

# --- data structures / util ---
slotmap = "1"
smallvec = "1"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
# The GPU/shader crates are painfully slow unoptimized; opt them (and only them) at -O1
# while keeping our own crates at -O0 for fast incremental builds.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Release builds of apps + the CLI/examples: smaller, faster binaries. Library consumers set
# their own profile; this only affects builds from this workspace. NOTE: deliberately NOT
# `panic = "abort"` — that would make `error_boundary`'s `catch_unwind` inert (see
# widgets/control/error_boundary.rs).
[profile.release]
lto = "thin"
strip = "debuginfo"

# Tests/CI: turn on integer overflow checks (defense-in-depth for the integer math — capture
# readback offsets, index arithmetic — so a wrap trips a panic in CI instead of silently
# wrapping). Inherits everything else from `dev`.
[profile.test]
overflow-checks = true

# Optimized build WITH debug assertions, so the #[cfg(debug_assertions)] census accessors are
# compiled in for long-running soaks (wgpu-migration 11 §2.9).
[profile.soak]
inherits = "release"
debug-assertions = true
