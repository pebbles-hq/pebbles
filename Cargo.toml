[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Reyco Seguma"]
repository = "https://github.com/pebbles-hq/pebbles"
homepage = "https://github.com/pebbles-hq/pebbles"
description = "Pebbles — a Flutter-style, desktop-first GUI framework built on Vello."
keywords = ["gui", "ui", "graphics", "vello", "flutter"]
categories = ["gui", "graphics", "rendering"]

# Warn-only shared lints (CI ratchets with `-D warnings` once the debt is measured;
# never bake `deny` into the manifest). Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# NOT `unsafe_code = "forbid"`: reactive.rs + native_menu.rs legitimately use unsafe.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# leftovers that always escape into GUI codebases:
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# the two perf footguns that matter in a per-frame hot path:
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"

[workspace.dependencies]
# --- internal crates (bottom-up: foundation → render → core → widgets → shell → umbrella) ---
pebbles-foundation = { path = "crates/pebbles-foundation", version = "0.0.1" }
pebbles-icons = { path = "crates/pebbles-icons", version = "0.0.1" }
# The render-backend-selectable crates carry `default-features = false` so the chosen
# backend (`vello` / `vello-hybrid`) is forwarded DOWN from whichever crate the app builds
# (each crate re-enables `vello` in its own `default`, so a plain build is unchanged).
pebbles-render = { path = "crates/pebbles-render", version = "0.0.1", default-features = false }
pebbles-core = { path = "crates/pebbles-core", version = "0.0.1", default-features = false }
pebbles-widgets = { path = "crates/pebbles-widgets", version = "0.0.1", default-features = false }
pebbles-shell = { path = "crates/pebbles-shell", version = "0.0.1", default-features = false }
pebbles-macros = { path = "crates/pebbles-macros", version = "0.0.1" }
pebbles = { path = "crates/pebbles", version = "0.0.1", default-features = false }
pebbles-testing = { path = "crates/pebbles-testing", version = "0.0.1", default-features = false }

# --- Linebender 2D stack ---
# Two swappable rasterizer backends, both pure-Rust Vello-family, picked by a
# `pebbles-render` feature (see docs/renderer-backend-plan.md):
#  · `vello`        — GPU-compute raster. Heavy per frame; the opt-in for complex
#                     zoomable vector (design tools / node canvases). Without default
#                     features it's the CPU-side `Scene` encoder (no wgpu); the shell
#                     re-enables `wgpu` for the GPU `Renderer`.
#  · `vello_hybrid` — hybrid CPU-preprocess + GPU-raster ("sparse strips"). Low-power;
#                     the battery-first default candidate. `vello_common` is its shared
#                     paint/geometry crate (both backends sit on the same kurbo/peniko).
vello = { version = "0.10", default-features = false }
vello_hybrid = { version = "0.2", default-features = false }
vello_common = { version = "0.2", default-features = false }
peniko = "0.6"
kurbo = "0.13"
parley = "0.11"

# --- windowing / gpu (shell only) ---
wgpu = "30"
winit = "0.30"
raw-window-handle = "0.6"
pollster = "1"
# A std::time drop-in that also works on wasm: on native it IS std::time (zero
# cost); on wasm `Instant`/`SystemTime` use `performance.now()`/`Date.now()`
# instead of panicking ("time not implemented on this platform"). Every crate that
# times anything at runtime uses THIS, never `std::time::{Instant,SystemTime}`.
web-time = "1.1"

# --- data structures / util ---
slotmap = "1"
smallvec = "1"

[profile.dev]
# The GPU/shader crates are painfully slow unoptimized; opt them (and only them) at -O1
# while keeping our own crates at -O0 for fast incremental builds.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
