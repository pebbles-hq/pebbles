[package]
name = "mobile"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `image-view` for the network feed media + avatars (loads via the native HTTP
# client — desktop-run, which is how we run the "mobile" app for now).
pebbles = { workspace = true, features = ["image-view"] }

# The feed loads real posts/comments/users from a public test API (dummyjson.com)
# over HTTP, off the UI thread — see `net.rs`. `ureq` is the same blocking client
# `ImageView` uses; `serde`/`serde_json` decode the JSON into typed structs.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
