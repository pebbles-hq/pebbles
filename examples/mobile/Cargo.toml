[package]
name = "mobile"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `image-view` for the network feed media + avatars (loads via the native HTTP
# client — desktop-run, which is how we run the "mobile" app for now).
pebbles = { workspace = true, features = ["image-view"] }
# `serde`/`serde_json` decode the API JSON into typed structs (both build on wasm).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The feed loads real posts/comments/users from a public test API (dummyjson.com) over
# HTTP via `ureq` — the same blocking client `ImageView` uses. Native-only: it doesn't
# build/run on wasm, so on the web build `net.rs` returns "offline" and the feed is empty.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"

[features]
# Render backend, forwarded to the pebbles umbrella. `vello-hybrid` (low-power) is the
# default; build classic vello with `--no-default-features --features vello`.
default = ["vello-hybrid"]
vello = ["pebbles/vello"]
vello-hybrid = ["pebbles/vello-hybrid"]

[lints]
workspace = true
