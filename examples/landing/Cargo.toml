[package]
name = "landing"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `image-view` pulls product / lifestyle photos over the network (placeholders offline).
pebbles = { workspace = true, features = ["image-view"] }

[dev-dependencies]
render-check = { path = "../../tools/render-check" }   # V27: live smoke checks (dev only; transitional)
pebbles-testing.workspace = true
pebbles-render.workspace = true

[features]
# Render backend, forwarded to the pebbles umbrella (and test-harness crates). vello-hybrid is the default; try the first-party renderer with --no-default-features --features wgpu.
default = ["vello-hybrid"]
vello-hybrid = ["pebbles/vello-hybrid", "pebbles-testing/vello-hybrid", "pebbles-render/vello-hybrid"]
wgpu = ["pebbles/wgpu", "pebbles/webgl", "pebbles-testing/wgpu", "pebbles-render/wgpu"]

[lints]
workspace = true
