[package]
name = "counter"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
pebbles = { workspace = true }

[features]
# Render backend, forwarded to the pebbles umbrella. `vello-hybrid` is the default;
# the first-party `wgpu` renderer is opt-in.
default = ["vello-hybrid"]
vello-hybrid = ["pebbles/vello-hybrid"]
wgpu = ["pebbles/wgpu"]

[lints]
workspace = true
