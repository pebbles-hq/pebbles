[package]
name = "desktop"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# `image-view` renders product thumbnails/galleries over the native HTTP client.
pebbles = { workspace = true, features = ["image-view"] }

# Local, offline persistence: a real embedded SQLite database (bundled — no system
# SQLite needed). See `db.rs`.
rusqlite = { version = "0.31", features = ["bundled"] }

# Optional "Sync from cloud" pull of fresh products from a public test API, off the
# UI thread — same stack the mobile sample uses. See `net.rs`.
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Headless mount/settle/inspect harness for the sample's smoke tests.
pebbles-testing.workspace = true
pebbles-render.workspace = true
pebbles-widgets.workspace = true

[lints]
workspace = true
