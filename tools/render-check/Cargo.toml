[package]
name = "render-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Pixel-render-check harness: renders each corpus case with pebbles-gpu and judges it against the golden model, analytic probes and committed self-goldens. Dev tool; never shipped."

[lib]
path = "src/lib.rs"

[[bin]]
name = "render-check"
path = "src/main.rs"

[dependencies]
pebbles-foundation.workspace = true
pebbles-render.workspace = true
pebbles-core.workspace = true
pebbles-widgets.workspace = true
pebbles-testing.workspace = true
pebbles-gpu.workspace = true
pebbles-icons.workspace = true   # icon corpus cases (prim/icons)
wgpu.workspace = true
pollster.workspace = true
peniko.workspace = true
kurbo.workspace = true
png = "0.18"
swash.workspace = true   # golden model: glyph outlines and bitmap strikes (05 §6.7a)
skrifa.workspace = true  # golden model: COLR paint graphs (V51)

[lints]
workspace = true
