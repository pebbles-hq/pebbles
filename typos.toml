[files]
extend-exclude = [
    "crates/pebbles-icons/src/tabler.rs", # generated
    "Cargo.lock",
]

# Identifiers the checker would false-positive on. The key is `extend-words`
# (hyphenated) — a misspelling here is a CONFIG error (exit 78), which silently
# failed the Typos job rather than reporting a typo.
[default.extend-words]
Pebbles = "Pebbles"
anc = "anc"                  # `anc_match` — ancestor-match flag in the file tree
ba = "ba"                    # b-alpha, from destructuring `[br, bg, bb, ba]`
mis = "mis"                  # the prefix in "mis-culling"
pn = "pn"                    # parent node, in tree walks
Noe = "Noe"                  # a person's name in a demo avatar list
unparseable = "unparseable"  # accepted variant; used in the accelerator parsers
lod = "lod"                  # level of detail (mip LOD), in the golden model and image mips
iy = "iy"                    # integer y index, paired with `ix`
Paramater = "Paramater"      # lyon_tessellation's own spelling: `UnsupportedParamater`
wdth = "wdth"                # the OpenType width-axis tag
ot = "ot"                    # fontTools' `otTables` module
